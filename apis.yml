apis:
- aid: apexfaucet-xyz:apex-on-x1-api
  name: APEX on X1 API
  description: 'Agent-facing API of APEX on the X1 blockchain, served from apexfaucet.xyz: a remote MCP server at
    /api/mcp (Streamable HTTP, MCP 2024-11-05; 87 tools per the provider on 2026-09-17, free read tools plus x402-paywalled
    premium tools), x402 pay-per-call REST endpoints under /api/x402/ (token detail, holders, trades, candles, whale
    ticker, top traders, wallet profile, bulk screener; USD-anchored $0.005-$0.50 per call settled in XNT on X1
    or USDC on Solana, discovery document at /.well-known/x402), an A2A endpoint at /api/a2a with its agent card
    at /.well-known/agent-card.json, and the free Agora agent registry at /api/agora/list. All endpoints return
    JSON. No OpenAPI is published; the machine-readable contracts are the MCP tools/list, the agent card and the
    x402 discovery document. The origin answered HTTP 522 for the whole 2026-09-19 pass, so only the provider''s
    robots.txt was fetched live.'
